<div class="card h-100 border-0 rounded-4 shadow-lg hover-lift bg-white overflow-hidden group">
  <div class="position-relative">
    <img [src]="receta.imagen" class="card-img-top object-fit-cover" [alt]="receta.titulo">
    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-50 opacity-0 group-hover-opacity-100 transition-opacity">
      <div class="d-flex gap-2">
        <a [routerLink]="['/recetas', receta.id]" class="btn btn-light rounded-circle shadow p-2">
          <i class="bi bi-eye-fill text-primary fs-5"></i>
        </a>
        <button (click)="voteRequest.emit(receta)" class="btn btn-light rounded-circle shadow p-2">
          <i class="bi bi-star-fill text-warning fs-5"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="card-body d-flex flex-column p-4">
    <h5 class="card-title fw-bold text-primary mb-1">{{ receta.titulo }}</h5>
    <div class="mb-3">
      <app-ad-rating-stars [rating]="receta.rating" [votes]="receta.votos"></app-ad-rating-stars>
    </div>
    <p class="card-text text-secondary small flex-grow-1">{{ receta.descripcion }}</p>
    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
      <span class="badge bg-light text-dark border rounded-pill px-3">
        <i class="bi bi-fire text-danger"></i> {{ receta.calorias || 0 }} kcal
      </span>
      <app-ad-button variant="outline-danger" (onClick)="deleteRequest.emit(receta.id)">
        <i class="bi bi-trash"></i>
      </app-ad-button>
    </div>
  </div>
</div>
