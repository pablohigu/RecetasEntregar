<div class="card h-100 border-0 rounded-4 shadow-soft hover-lift bg-white overflow-hidden group position-relative">
  
  <div class="position-absolute top-0 start-0 m-3 z-2">
    <div class="bg-white rounded-3 shadow-sm px-2 py-1 border d-flex align-items-center gap-1">
      <i class="bi bi-check-circle-fill text-success"></i>
      <small class="fw-bold text-secondary">#{{receta.id}}</small>
    </div>
  </div>

  <div class="position-relative overflow-hidden card-header-img">
    <img [src]="receta.imagen" class="w-100 h-100 object-fit-cover transition-transform" [alt]="receta.titulo">
    
    <div class="overlay d-flex justify-content-center align-items-center gap-3">
      <button (click)="voteRequest.emit(receta)" class="btn btn-warning rounded-circle p-3 shadow text-white hover-scale" title="Votar">
        <i class="bi bi-star-fill fs-4"></i>
      </button>
      <a [routerLink]="['/recetas', receta.id]" class="btn btn-white bg-white rounded-circle p-3 shadow text-primary hover-scale" title="Ver Detalle">
        <i class="bi bi-eye-fill fs-4"></i>
      </a>
    </div>
  </div>

  <div class="card-body d-flex flex-column p-4">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title fw-bold text-primary mb-0 text-truncate pe-2">{{ receta.titulo }}</h5>
      <div class="d-flex align-items-center bg-light rounded-pill px-2 py-1">
        <i class="bi bi-star-fill text-warning small me-1"></i>
        <small class="fw-bold">{{ receta.rating | number:'1.1-1' }}</small>
      </div>
    </div>

    <p class="card-text text-secondary small flex-grow-1 line-clamp-3 mb-4">
      {{ receta.descripcion }}
    </p>
    
    <div class="row g-2 border-top pt-3 text-center">
      <div class="col-4 border-end">
        <div class="d-flex flex-column text-secondary">
          <i class="bi bi-fire fs-5 text-danger mb-1"></i>
          <small class="fw-bold" style="font-size: 0.75rem;">{{ receta.calorias || 0 }}</small>
          <small class="text-muted" style="font-size: 0.65rem;">CAL</small>
        </div>
      </div>
      <div class="col-4 border-end">
        <div class="d-flex flex-column text-secondary">
          <i class="bi bi-people-fill fs-5 text-primary mb-1"></i>
          <small class="fw-bold" style="font-size: 0.75rem;">{{ receta.votos }}</small>
          <small class="text-muted" style="font-size: 0.65rem;">VOTOS</small>
        </div>
      </div>
      <div class="col-4">
         <button class="btn btn-link text-danger p-0 w-100 h-100 text-decoration-none opacity-50 hover-opacity-100" 
                 (click)="deleteRequest.emit(receta.id)">
            <i class="bi bi-trash-fill fs-5"></i>
            <div class="lh-1"><small style="font-size: 0.65rem;">BORRAR</small></div>
         </button>
      </div>
    </div>
  </div>
</div>
