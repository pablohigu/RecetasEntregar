<div class="modal d-block fade show" style="background: rgba(93, 64, 55, 0.6); backdrop-filter: blur(5px);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-5 border-0 shadow-lg overflow-hidden">
      <div class="modal-header bg-light border-0 py-3 justify-content-center position-relative">
        <h5 class="modal-title fw-bold text-primary font-serif">¡Tu opinión cuenta!</h5>
        <button type="button" class="btn-close position-absolute end-0 top-0 m-3" (click)="close.emit()"></button>
      </div>

      <div class="modal-body text-center px-5 py-4">
        <h4 class="mb-2">{{ receta.titulo }}</h4>
        <p class="text-muted small mb-4">¿Qué te ha parecido esta receta?</p>
        
        <div class="d-flex justify-content-center gap-3 mb-4">
          @for (star of [1,2,3,4,5]; track star) {
            <i class="bi cursor-pointer display-4 transition-all" 
               [class.bi-star-fill]="hover >= star || (!hover && selected >= star)" 
               [class.bi-star]="hover < star && selected < star"
               [class.text-warning]="hover >= star || selected >= star"
               [class.text-muted]="hover < star && selected < star"
               [style.transform]="(hover === star) ? 'scale(1.3) rotate(-10deg)' : 'scale(1)'"
               (mouseenter)="hover = star"
               (mouseleave)="hover = 0"
               (click)="selected = star"></i>
          }
        </div>
        
        <div class="d-flex justify-content-center min-h-30">
          <span class="badge bg-secondary rounded-pill px-3 py-2 fade-in" *ngIf="selected > 0">
            {{ selected === 5 ? '¡Excelente!' : selected === 4 ? 'Muy buena' : selected === 3 ? 'Está bien' : 'Mejorable' }}
          </span>
        </div>
      </div>

      <div class="modal-footer border-0 justify-content-center pb-4 pt-0">
        <button class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow hover-lift" 
                [disabled]="selected === 0" 
                (click)="confirm.emit(selected)">
          <i class="bi bi-send-fill me-2"></i> Enviar Valoración
        </button>
      </div>
    </div>
  </div>
</div>
