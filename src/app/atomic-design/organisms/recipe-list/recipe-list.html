<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  @for (receta of recipes(); track receta.id) {
    <div class="col">
      <app-ad-recipe-card [receta]="receta" 
                          (deleteRequest)="deleteRequest.emit($event)" 
                          (voteRequest)="voteRequest.emit($event)">
      </app-ad-recipe-card>
    </div>
  } @empty {
    <div class="col-12 text-center py-5">
      <p class="text-muted fs-5">No hay recetas disponibles.</p>
    </div>
  }
</div>
