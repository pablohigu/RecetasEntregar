<div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 pb-5">
  @for (receta of recipes(); track receta.id) {
    <div class="col d-flex"> 
      <app-ad-recipe-card 
        class="w-100" 
        [receta]="receta" 
        (deleteRequest)="deleteRequest.emit($event)" 
        (voteRequest)="voteRequest.emit($event)">
      </app-ad-recipe-card>
    </div>
  } @empty {
    <div class="col-12 text-center py-5">
      <div class="py-5 opacity-50">
        <i class="bi bi-basket display-1 text-muted"></i>
        <p class="mt-3 fs-4 font-serif text-secondary">No encontramos recetas...</p>
      </div>
    </div>
  }
</div>
