<div class="card border-0 shadow-sm p-3 mb-5 bg-white rounded-4">
  <div class="row g-2 align-items-center">
    <div class="col-md-8">
      <div class="input-group">
        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control border-start-0 ps-0 shadow-none" 
               placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="emitFilter()">
      </div>
    </div>
    <div class="col-md-4">
      <select class="form-select border-0 fw-bold text-secondary cursor-pointer shadow-none" 
              [(ngModel)]="minRating" (change)="emitFilter()">
        <option value="0">Todas</option>
        <option value="3">⭐ 3+</option>
        <option value="4">⭐⭐ 4+</option>
        <option value="5">⭐⭐⭐ 5</option>
      </select>
    </div>
  </div>
</div>
