<div class="card border-0 shadow-soft p-2 mb-5 bg-white rounded-pill mx-auto" style="max-width: 900px;">
  <div class="row g-0 align-items-center">
    <div class="col-md-7 border-end-md">
      <div class="input-group">
        <span class="input-group-text bg-transparent border-0 ps-4 text-primary">
          <i class="bi bi-search fs-5"></i>
        </span>
        <input type="text" 
               class="form-control border-0 shadow-none py-3" 
               placeholder="¿Qué se te antoja hoy? (ej. Paella)" 
               [(ngModel)]="searchTerm" 
               (input)="emitFilter()">
      </div>
    </div>
    
    <div class="col-md-5 ps-md-3 pe-2">
      <div class="input-group">
        <span class="input-group-text bg-transparent border-0 text-warning">
          <i class="bi bi-funnel-fill"></i>
        </span>
        <select class="form-select border-0 shadow-none py-3 fw-bold text-secondary cursor-pointer rounded-pill" 
                [(ngModel)]="minRating" 
                (change)="emitFilter()">
          <option value="0">Todas las valoraciones</option>
          <option value="3">Solo lo bueno (3+ ★)</option>
          <option value="4">Muy rico (4+ ★)</option>
          <option value="5">Exquisiteces (5 ★)</option>
        </select>
      </div>
    </div>
  </div>
</div>
